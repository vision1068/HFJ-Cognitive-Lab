[build]
command = "npm run build"
publish = "dist"
functions = "netlify/functions"

# Redirect API calls to Netlify Functions so the frontend's existing
# same-origin /api/* paths work unchanged.
[[redirects]]
from = "/api/psx/*"
to = "/.netlify/functions/psx/:splat"
status = 200

[[redirects]]
from = "/api/yahoo/*"
to = "/.netlify/functions/yahoo/:splat"
status = 200

# SPA fallback: route all non-file requests to index.html so React Router works.
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
